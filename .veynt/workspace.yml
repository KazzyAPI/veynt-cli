overview: >-
  The Veynt OSS project is an AI-native pre-commit engineering reviewer designed
  to analyze staged changes and branch diffs, detecting vulnerabilities,
  architectural drift, malicious AI rule changes, and low-quality AI-generated
  code before they enter your repository. This comprehensive tool is built using
  TypeScript and leverages the pnpm package manager, ensuring a modular and
  maintainable architecture across its packages. The project consists of several
  key components, each with a distinct role within the monorepo structure:


  1. **@veynt/analyzers**: Responsible for repository analysis and baseline
  generation to ensure consistent standards are maintained.

  2. **@veynt/cli**: Provides the command-line interface through which users
  interact with Veynt, executing commands like `init`, `scan`, and configuration
  adjustments.

  3. **@veynt/config**: Manages configuration loading and merging across
  different levels (repository, user, environment) to provide a flexible and
  adaptable review process.

  4. **@veynt/core**: Contains shared types and utilities that are essential for
  the operation of other packages within the monorepo.

  5. **@veynt/findings**: Handles parsing and managing findings from AI reviews,
  including blocking and suppression services.

  6. **@veynt/git**: Integrates with Git to analyze staged changes and branch
  diffs, providing real-time feedback during development cycles.

  7. **@veynt/hooks**: Ensures that pre-commit hooks are installed and
  configured correctly for consistent review processes across repositories.

  8. **@veynt/providers**: Acts as an adapter layer for various AI providers,
  allowing Veynt to utilize different services seamlessly.

  9. **@veynt/review-engine**: Orchestrates the review process, handling prompt
  construction and chunking of data for efficient AI interactions.
