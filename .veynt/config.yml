version: "1"
provider:
  name: gemini
  model: gemini-2.5-flash
  maxTokens: 4096
review:
  strictness: advisory
  suggestions: true
  verbose: false
  chunking:
    enabled: true
    maxFilesPerChunk: 4
    maxCharsPerChunk: 40000
    delayMsBetweenChunks: 2000
    requestsPerMinute: 5
    maxRetries: 6
blocking:
  local:
    - high
    - critical
  ci:
    - medium
    - high
    - critical
ignore:
  findings: []
  rules: []
scan:
  includeContextFiles: true
  maxContextFiles: 10
  scanRuleFiles: true
  excludePatterns:
    - pnpm-lock.yaml
    - package-lock.json
    - yarn.lock
    - "**/*.lock"
