# Publish veynt-cli to npm via npm Trusted Publishing (OIDC).
# https://docs.npmjs.com/trusted-publishers/

name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Test
        run: pnpm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Prepare npm for OIDC publish
        run: |
          echo "npm $(npm --version)"
          echo "node $(node --version)"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || (echo "::error::OIDC not available — check id-token: write permission" && exit 1)
          # setup-node/pnpm can write an empty _authToken line that blocks OIDC
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            sed -i '/always-auth/d' "$npmrc"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Set package version from release tag
        working-directory: packages/cli
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version
          chmod +x dist/index.js

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --provenance
